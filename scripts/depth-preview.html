<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Paws & Pours depth tiles</title>
<style>body{margin:16px;background:#201828;color:#ead6bd;font:14px system-ui}canvas{display:block;max-width:100%;height:auto;image-rendering:pixelated}select{margin-bottom:12px;padding:8px}</style>
<label>Theme <select id="theme"><option>Cozy Village Pub</option><option>Haunted Moonlit Inn</option><option>Pirate Cat Tavern</option></select></label>
<label><input id="customers" type="checkbox"> Show customers and orders</label>
<canvas width="1088" height="712"></canvas>
<script type="module">
import { loadGameAssets } from '/client/game-assets.ts';
import { makeTavern, stationBounds, nextCustomerSeat, RECIPES } from '/shared/game.ts';
import { drawTavernFloor, drawTavernCounter, drawBarGate } from '/client/tavern-renderer.ts';
await loadGameAssets();
const load = async src => { const image = new Image(); image.src = src; await image.decode(); return image; };
const [ingredients, bin, cats] = await Promise.all([
  load('/client/assets/tilemap/ingredients-spritesheet.png'), load('/client/assets/props/scrap-bin.png'), load('/client/assets/tilemap/cat-bartender-spritesheet.png'),

]);
const context = document.querySelector('canvas').getContext('2d');
function render() {
  const tavern = makeTavern(42); tavern.theme = document.querySelector('select').value;
  const orders = [];
  if (document.querySelector('#customers').checked) for (let index = 0; index < 12; index++) {
    const seat = nextCustomerSeat(tavern, orders, index);
    orders.push({ id: `preview-${index}`, recipeId: RECIPES[index % RECIPES.length].id,
      tableId: seat.tableId, seatId: seat.id, customer: 'Guest', patience: index === 3 ? 20 : 80, maxPatience: 100 });
  }
  context.imageSmoothingEnabled = false;
  drawTavernFloor(context, tavern);
  tavern.stations.sort((a,b) => stationBounds(a).bottom - stationBounds(b).bottom).forEach(station =>
    drawTavernCounter(context, tavern, station, ingredients, bin, station.id === 'mix', orders, cats));
  drawBarGate(context, [], true, tavern.theme);
}
document.querySelector('select').addEventListener('change', render);
document.querySelector('#customers').addEventListener('change', render);
render(); document.body.dataset.ready = 'true';
</script></html>
